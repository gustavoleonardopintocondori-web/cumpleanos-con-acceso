<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff7f7">
  <title>Una sorpresa para ti ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:light;--ink:#452d39;--muted:#8e7480;--pink:#bd4c6a;--line:#f0dfe4;--card:#fffdfc}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 15% 10%,#f5dce4 0,transparent 40%),radial-gradient(ellipse at 90% 90%,#f6e5dc 0,transparent 42%),#fff7f7;color:var(--ink);font-family:'DM Sans',sans-serif}.card{width:min(430px,100%);padding:clamp(27px,7vw,44px);border:1px solid #fff;background:#fffdfce8;border-radius:28px;box-shadow:0 24px 80px #7d45551a;text-align:center}.heart{width:56px;height:56px;display:grid;place-items:center;border-radius:50%;margin:0 auto 20px;background:#f8e2e8;color:var(--pink);font:28px 'Playfair Display',serif}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.22em;color:var(--pink);font-weight:700}.card h1{font:500 clamp(29px,8vw,38px)/1.13 'Playfair Display',serif;margin:11px 0}.card p{color:var(--muted);font-size:14px;line-height:1.65;margin:0 auto 24px;max-width:310px}.field{text-align:left;margin:0 0 14px}.field label{display:block;font-size:12px;font-weight:700;margin:0 0 7px}.field input{width:100%;border:1px solid var(--line);border-radius:12px;background:white;padding:13px 14px;color:var(--ink);font:inherit}.field input:focus{outline:3px solid #f3c7d3;outline-offset:1px}.enter{width:100%;border:0;border-radius:13px;background:var(--pink);color:white;padding:14px;font:600 14px 'DM Sans',sans-serif;cursor:pointer;transition:transform .2s,filter .2s}.enter:hover{filter:brightness(.96);transform:translateY(-1px)}.enter:disabled{opacity:.65;cursor:wait;transform:none}.error{min-height:21px;margin:12px 0 0!important;color:#a32f4e!important;font-size:12px!important}.note{margin-top:21px;color:#aa96a0;font-size:11px}.heart-line{color:var(--pink)}
    @media(prefers-reduced-motion:no-preference){.card{animation:appear .5s ease-out}@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}}
  </style>
</head>
<body>
  <main class="card">
    <div class="heart" aria-hidden="true">♡</div>
    <div class="eyebrow">Una sorpresa especial</div>
    <h1>Solo para ti</h1>
    <p>Esta página guarda una sorpresa de cumpleaños. Ingresa los datos que te compartieron para abrirla.</p>
    <form id="accessForm">
      <div class="field"><label for="username">Usuario</label><input id="username" name="username" autocomplete="username" placeholder="Escribe tu usuario" required></div>
      <div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Escribe tu contraseña" required></div>
      <button class="enter" id="enterButton" type="submit">Abrir mi sorpresa&nbsp; ♡</button>
      <p class="error" id="error" role="status" aria-live="polite"></p>
    </form>
    <div class="note">Hecho con amor <span class="heart-line">♡</span></div>
  </main>
  <script>
    const form=document.getElementById('accessForm');
    const button=document.getElementById('enterButton');
    const error=document.getElementById('error');
    const fromBase64=value=>Uint8Array.from(atob(value),c=>c.charCodeAt(0));
    form.addEventListener('submit',async event=>{
      event.preventDefault();
      error.textContent='';
      const username=document.getElementById('username').value.trim().toLowerCase();
      const password=document.getElementById('password').value;
      if(username!=='amor'){error.textContent='Usuario o contraseña incorrectos.';return}
      button.disabled=true;button.textContent='Abriendo tu sorpresa…';
      try{
        const response=await fetch(new URL('content.enc',location.href),{cache:'no-store'});
        if(!response.ok)throw new Error('El contenido no está disponible.');
        const payload=await response.json();
        const rawKey=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
        const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:fromBase64(payload.salt),iterations:payload.iterations,hash:'SHA-256'},rawKey,{name:'AES-GCM',length:256},false,['decrypt']);
        const opened=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromBase64(payload.iv)},key,fromBase64(payload.data));
        const page=new TextDecoder().decode(opened);
        document.open();document.write(page);document.close();
      }catch{
        error.textContent='Usuario o contraseña incorrectos. Revisa los datos e inténtalo de nuevo.';
        document.getElementById('password').value='';
        button.disabled=false;button.innerHTML='Abrir mi sorpresa&nbsp; ♡';
      }
    });
  </script>
</body>
</html>
